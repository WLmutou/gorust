[package]
name = "go-macros"
version = "0.1.0"
edition = "2021"
authors = ["lijun <1489573464@qq.com>"]
description = "Procedural macros for the gorust crate - providing Go-style concurrency macros for Rust"
license = "MIT"
repository = "https://github.com/WLmutou/gorust"
homepage = "https://github.com/WLmutou/gorust"
documentation = "https://docs.rs/go-macros"
keywords = ["concurrency", "goroutines", "macros", "procedural-macro", "go"]
categories = ["concurrency", "development-tools"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
log = "0.4"
quote = "1.0"
proc-macro2 = "1.0"

[badges]
maintenance = { status = "experimental" }