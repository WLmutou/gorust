[package]
name = "gorust"
version = "0.1.8"
edition = "2021"
authors = ["lijun <1489573464@qq.com>"]
description = "Go-style concurrency in Rust - bringing Go-style concurrency patterns to Rust with familiar primitives like goroutines and channels"
license = "MIT"
repository = "https://github.com/WLmutou/gorust"
homepage = "https://github.com/WLmutou/gorust"
documentation = "https://docs.rs/gorust"
keywords = ["concurrency", "goroutines", "channels", "async", "go"]
categories = ["concurrency", "asynchronous"]

[dependencies]
parking_lot = "0.12"
num_cpus = "1.6"
lazy_static = "1.4"
mio = { version = "0.8", features = ["os-poll", "net", "os-ext"] }
log = "0.4"
env_logger = "0.10"
ctrlc = "3.4.5"
libc = "0.2"

[dependencies.go-macros]
#path = "./go-macros"
#path = "./go-macros"
version = "0.1.2" 

[workspace]
members = [
    ".",
    "go-macros",
]

[badges]
maintenance = { status = "experimental" }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "benchmarks"
harness = false


[profile.release]
opt-level = 3
lto = "fat"          
codegen-units = 1     
panic = "abort"      
strip = true
